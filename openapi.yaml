                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.course_scheduling.CourseSet'
    /v1/students/{studentId}/makeups:
        get:
            tags:
                - MakeupService
            description: ListMakeupsByStudentID returns courses the student has makeup classes for.
            operationId: MakeupService_ListMakeupsByStudentID
            parameters:
                - name: studentId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.course_scheduling.CourseSet'
    /v1/teachers:
        get:
            tags:
                - TeacherService
            description: ListTeachers returns a page of teachers.
            operationId: TeacherService_ListTeachers
            parameters:
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  schema:
                    type: string
                - name: filter
                  in: query
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.course_scheduling.TeacherSet'
        post:
            tags:
                - TeacherService
            description: SaveTeacher creates or updates a teacher.
            operationId: TeacherService_SaveTeacher
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1.course_scheduling.Teacher'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.course_scheduling.Teacher'
    /v1/teachers/{id}:
        get:
            tags:
                - TeacherService
            description: GetTeacher returns a single teacher by ID.
            operationId: TeacherService_GetTeacher
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.course_scheduling.Teacher'
        delete:
            tags:
                - TeacherService
            description: DeleteTeacher hard-deletes a teacher by ID.
            operationId: TeacherService_DeleteTeacher
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/teachers/{teacherId}/qualifications:
        get:
            tags:
                - QualificationService
            description: |-
                ListQualificationsByTeacherID returns course types the teacher is qualified
                 to teach.
            operationId: QualificationService_ListQualificationsByTeacherID
            parameters:
                - name: teacherId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.course_scheduling.CourseTypeSet'
components:
    schemas:
        v1.course_scheduling.AbsenceRecord:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID.
                studentId:
                    type: string
                    description: The absent student ID.
                courseId:
                    type: string
                    description: The course missed.
                courseSlotId:
                    type: string
                    description: The specific slot missed.
                scheduleDate:
                    type: string
                    description: The date of absence.
                    format: date-time
                missedHours:
                    type: integer
                    description: Hours missed.
                    format: int32
                absenceType:
                    type: integer
                    description: Type of absence.
                    format: enum
                reason:
                    type: string
                    description: Reason or notes.
                createdAt:
                    type: string
                    description: Record creation time.
                    format: date-time
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: AbsenceRecord records a factual student absence.
        v1.course_scheduling.AbsenceRecordSet:
            type: object
            properties:
                absences:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.AbsenceRecord'
                nextPageToken:
                    type: string
        v1.course_scheduling.AssignClassroomToCourseSlotRequest:
            required:
                - slotIds
                - classroomId
            type: object
            properties:
                slotIds:
                    type: array
                    items:
                        type: string
                    description: One or more slot IDs to assign.
                classroomId:
                    type: string
                    description: The classroom to assign.
        v1.course_scheduling.AssignCourseToCourseSlotRequest:
            required:
                - slotIds
                - courseId
            type: object
            properties:
                slotIds:
                    type: array
                    items:
                        type: string
                    description: One or more slot IDs to assign.
                courseId:
                    type: string
                    description: The course to assign.
        v1.course_scheduling.AssignTeacherToCourseSlotRequest:
            required:
                - slotIds
                - teacherId
            type: object
            properties:
                slotIds:
                    type: array
                    items:
                        type: string
                    description: One or more slot IDs to assign.
                teacherId:
                    type: string
                    description: The teacher to assign.
        v1.course_scheduling.Capacity:
            type: object
            properties:
                max:
                    type: integer
                    description: Maximum number of students.
                    format: int32
                enrolled:
                    type: integer
                    description: Current number of enrolled students.
                    format: int32
            description: Capacity tracks enrollment capacity for a course.
        v1.course_scheduling.CheckTeacherQualifiedForCourseResponse:
            type: object
            properties:
                qualified:
                    type: boolean
        v1.course_scheduling.Classroom:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID (UUID).
                location:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.Location'
                    description: Physical location.
                capacity:
                    type: integer
                    description: Total seat capacity.
                    format: int32
                allocated:
                    type: integer
                    description: Currently allocated seats.
                    format: int32
                status:
                    type: integer
                    description: Operational status.
                    format: enum
            description: |-
                Classroom represents a physical teaching room.

                 The aggregate carries no timestamps, so neither does this message.
        v1.course_scheduling.ClassroomSet:
            type: object
            properties:
                classrooms:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.Classroom'
                nextPageToken:
                    type: string
        v1.course_scheduling.ContactInfo:
            type: object
            properties:
                phone:
                    type: string
                    description: Required. Chinese mobile phone number (e.g. "13800138000").
                email:
                    type: string
                    description: Optional email address.
            description: ContactInfo holds phone and email for a student or teacher.
        v1.course_scheduling.Course:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID (UUID).
                courseTypeId:
                    type: string
                    description: References the type of course.
                capacity:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.Capacity'
                    description: Enrollment capacity.
                enrollment:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.EnrollmentWindow'
                    description: Enrollment window.
                period:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.CoursePeriod'
                    description: Teaching period.
            description: |-
                Course represents a scheduled course offering.

                 The aggregate carries no timestamps, so neither does this message.
        v1.course_scheduling.CourseEnrollment:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID.
                studentId:
                    type: string
                    description: The enrolled student ID.
                courseId:
                    type: string
                    description: The course ID.
                status:
                    type: integer
                    description: Enrollment status.
                    format: enum
                enrolledAt:
                    type: string
                    description: Time of enrollment.
                    format: date-time
                completedAt:
                    type: string
                    description: Time of completion (if completed).
                    format: date-time
                droppedAt:
                    type: string
                    description: Time of drop (if dropped).
                    format: date-time
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: CourseEnrollment represents a student's enrollment in a course.
        v1.course_scheduling.CourseEnrollmentSet:
            type: object
            properties:
                enrollments:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.CourseEnrollment'
                nextPageToken:
                    type: string
        v1.course_scheduling.CoursePeriod:
            type: object
            properties:
                startAt:
                    type: string
                    description: Course start date.
                    format: date-time
                endAt:
                    type: string
                    description: Course end date.
                    format: date-time
                totalHours:
                    type: integer
                    description: Total scheduled teaching hours.
                    format: int32
                completedHours:
                    type: integer
                    description: Hours completed so far.
                    format: int32
            description: CoursePeriod defines the date range and hours of a course.
        v1.course_scheduling.CourseSet:
            type: object
            properties:
                courses:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.Course'
                nextPageToken:
                    type: string
        v1.course_scheduling.CourseSlot:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID (UUID).
                courseId:
                    type: string
                    description: The course this slot belongs to.
                weekday:
                    type: integer
                    description: Day of the week.
                    format: enum
                timeRange:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.DayTimeRange'
                    description: Time range within the day.
                teacherId:
                    type: string
                    description: Assigned teacher ID. -1 means unassigned.
                classroomId:
                    type: string
                    description: Assigned classroom ID. Empty means unassigned.
                createdAt:
                    type: string
                    description: Record creation time.
                    format: date-time
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: CourseSlot represents a weekly recurring time slot for a course.
        v1.course_scheduling.CourseSlotChange:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID.
                courseId:
                    type: string
                    description: The course affected.
                applicantId:
                    type: string
                    description: The teacher who requested the change.
                changeType:
                    type: integer
                    description: Type of change.
                    format: enum
                originalPlan:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.OriginalPlan'
                    description: The original schedule plan.
                targetPlan:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.TargetPlan'
                    description: The target schedule plan.
                reason:
                    type: string
                    description: Reason for the change.
                createdAt:
                    type: string
                    description: Record creation time.
                    format: date-time
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: CourseSlotChange represents a temporary schedule modification.
        v1.course_scheduling.CourseSlotChangeSet:
            type: object
            properties:
                courseSlotChanges:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.CourseSlotChange'
                nextPageToken:
                    type: string
        v1.course_scheduling.CourseSlotSet:
            type: object
            properties:
                courseSlots:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.CourseSlot'
                nextPageToken:
                    type: string
        v1.course_scheduling.CourseType:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID (UUID).
                name:
                    type: string
                    description: Display name.
                description:
                    type: string
                    description: Description of this course type.
                createdAt:
                    type: string
                    description: Record creation time.
                    format: date-time
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: CourseType categorizes courses (e.g. "Piano Grade 3", "Violin Beginners").
        v1.course_scheduling.CourseTypeSet:
            type: object
            properties:
                courseTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.CourseType'
                nextPageToken:
                    type: string
        v1.course_scheduling.DayTime:
            type: object
            properties:
                hour:
                    type: integer
                    description: Hour (0-23).
                    format: int32
                minute:
                    type: integer
                    description: Minute (0-59).
                    format: int32
            description: DayTime represents a time of day (hour and minute).
        v1.course_scheduling.DayTimeRange:
            type: object
            properties:
                start:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.DayTime'
                    description: Start time.
                end:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.DayTime'
                    description: End time.
            description: DayTimeRange represents a time span within a single day.
        v1.course_scheduling.EnrollmentWindow:
            type: object
            properties:
                startAt:
                    type: string
                    description: Enrollment open date.
                    format: date-time
                endAt:
                    type: string
                    description: Enrollment close date.
                    format: date-time
                dropDeadline:
                    type: string
                    description: Last date a student may drop without penalty.
                    format: date-time
            description: EnrollmentWindow defines the period during which students can enroll or drop.
        v1.course_scheduling.Location:
            type: object
            properties:
                building:
                    type: string
                    description: Building name or identifier.
                floor:
                    type: integer
                    description: Floor number.
                    format: int32
                room:
                    type: string
                    description: Room number or name.
            description: Location identifies the physical position of a classroom.
        v1.course_scheduling.OriginalPlan:
            type: object
            properties:
                slotId:
                    type: string
                    description: The original course slot ID.
                date:
                    type: string
                    description: The scheduled date.
                    format: date-time
                teacherId:
                    type: string
                    description: The originally assigned teacher ID.
                classroomId:
                    type: string
                    description: The originally assigned classroom ID.
                startTime:
                    type: string
                    description: Start time string (e.g. "16:00").
                endTime:
                    type: string
                    description: End time string (e.g. "18:00").
            description: OriginalPlan captures the original schedule before a slot change.
        v1.course_scheduling.Qualification:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID.
                teacherId:
                    type: string
                    description: The qualified teacher ID.
                courseTypeId:
                    type: string
                    description: The course type the teacher is qualified for.
                certifiedAt:
                    type: string
                    description: Time the qualification was granted.
                    format: date-time
                status:
                    type: integer
                    description: Qualification status.
                    format: enum
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: Qualification records that a teacher is certified to teach a course type.
        v1.course_scheduling.QualificationSet:
            type: object
            properties:
                qualifications:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.Qualification'
                nextPageToken:
                    type: string
        v1.course_scheduling.Student:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID.
                name:
                    type: string
                    description: Student's full name.
                studentType:
                    type: integer
                    description: Student type (external or internal).
                    format: enum
                contact:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.ContactInfo'
                    description: Contact information.
                status:
                    type: integer
                    description: Lifecycle status.
                    format: enum
                createdAt:
                    type: string
                    description: Record creation time.
                    format: date-time
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: Student represents a student enrolled in the scheduling system.
        v1.course_scheduling.StudentMakeup:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID.
                studentId:
                    type: string
                    description: The student taking the makeup.
                courseId:
                    type: string
                    description: The course.
                originalSlotId:
                    type: string
                    description: The slot that was missed.
                originalDate:
                    type: string
                    description: The date that was missed.
                    format: date-time
                targetSlotId:
                    type: string
                    description: The slot for the makeup session.
                targetDate:
                    type: string
                    description: The date of the makeup session.
                    format: date-time
                makeupHours:
                    type: integer
                    description: Hours of makeup instruction.
                    format: int32
                status:
                    type: integer
                    description: Booking status.
                    format: enum
                completedAt:
                    type: string
                    description: Completion time (if completed).
                    format: date-time
                createdAt:
                    type: string
                    description: Record creation time.
                    format: date-time
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: StudentMakeup represents a booked makeup class for a student.
        v1.course_scheduling.StudentMakeupSet:
            type: object
            properties:
                makeups:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.StudentMakeup'
                nextPageToken:
                    type: string
        v1.course_scheduling.StudentSet:
            type: object
            properties:
                students:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.Student'
                nextPageToken:
                    type: string
        v1.course_scheduling.TargetPlan:
            type: object
            properties:
                targetStartAt:
                    type: string
                    description: New start datetime.
                    format: date-time
                targetEndAt:
                    type: string
                    description: New end datetime.
                    format: date-time
                teacherId:
                    type: string
                    description: New teacher ID.
                classroomId:
                    type: string
                    description: New classroom ID.
            description: TargetPlan captures the new schedule after a slot change.
        v1.course_scheduling.Teacher:
            type: object
            properties:
                id:
                    type: string
                    description: System-assigned ID.
                studentId:
                    type: string
                    description: Linked student-system ID (for when the teacher also enrolls as a student).
                name:
                    type: string
                    description: Teacher's full name.
                title:
                    type: string
                    description: Professional title (e.g. "Senior Trainer", "Gold Instructor").
                contact:
                    allOf:
                        - $ref: '#/components/schemas/v1.course_scheduling.ContactInfo'
                    description: Contact information.
                status:
                    type: integer
                    description: Lifecycle status.
                    format: enum
                createdAt:
                    type: string
                    description: Record creation time.
                    format: date-time
                updatedAt:
                    type: string
                    description: Last modification time.
                    format: date-time
            description: Teacher represents an instructor in the scheduling system.
        v1.course_scheduling.TeacherSet:
            type: object
            properties:
                teachers:
                    type: array
                    items:
                        $ref: '#/components/schemas/v1.course_scheduling.Teacher'
                nextPageToken:
                    type: string
tags:
    - name: AbsenceService
      description: AbsenceService owns the absence record aggregate.
    - name: ClassroomService
      description: ClassroomService owns the classroom aggregate.
    - name: CourseService
      description: CourseService owns the course aggregate.
    - name: CourseSlotChangeService
      description: CourseSlotChangeService owns the course slot change aggregate.
    - name: CourseSlotService
      description: CourseSlotService owns the course slot aggregate.
    - name: EnrollmentService
      description: |-
        EnrollmentService owns the enrollment aggregate.

         The two cross-aggregate listings stay here rather than moving to Course or
         Student: they are enrollment questions ("which rows link X and Y") whose
         answers happen to be courses or students.
    - name: MakeupService
      description: MakeupService owns the makeup booking aggregate.
    - name: QualificationService
      description: QualificationService owns the qualification aggregate.
    - name: StudentService
      description: 'StudentService owns the student aggregate: commands mutate it, queries read it.'
    - name: TeacherService
      description: TeacherService owns the teacher aggregate.
