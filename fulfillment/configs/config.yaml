server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: mysql
    source: ${DATABASE_SOURCE:root:root@tcp(127.0.0.1:3306)/fulfillment?timeout=5s&parseTime=True&loc=Local&charset=utf8mb4}
    # 读库连接串。留空 = 回落到 source（单库环境只配 source 就够）。
    # 写侧（adapters/command/data/mysql）始终用 source，读侧用 read_source。
    read_source: ${DATABASE_READ_SOURCE:}
    # 开发期打开，把每条 SQL 打到日志；生产关掉。
    debug: true
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    read_timeout: 0.2s
    write_timeout: 0.2s
